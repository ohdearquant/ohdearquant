  <text x="78" y="104" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f5f7fb">The model is the interface.</text>
  <text x="78" y="156" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f6c453">khive is the computer.</text>
  <text x="78" y="200" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#b8c2d9">Memory, coordination, a computer, inference and proofs for long-horizon AI agents. Rust and Python. Open source.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0b1020" font-weight="600">
    <rect x="860" y="70" width="112" height="30" rx="15" fill="#f6c453"/><text x="916" y="90" text-anchor="middle">khive</text>
    <rect x="982" y="70" width="112" height="30" rx="15" fill="#9fd3ff"/><text x="1038" y="90" text-anchor="middle">lionagi</text>
    <rect x="860" y="112" width="112" height="30" rx="15" fill="#b7f0c1"/><text x="916" y="132" text-anchor="middle">computer</text>
    <rect x="982" y="112" width="112" height="30" rx="15" fill="#ffb3c1"/><text x="1038" y="132" text-anchor="middle">Lattice</text>
    <rect x="860" y="154" width="234" height="30" rx="15" fill="#d9c6ff"/><text x="977" y="174" text-anchor="middle">LNkernel · Lean 4</text>
