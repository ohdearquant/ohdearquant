<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="The stack: a model on top; lionagi orchestrates; khive remembers and coordinates; khive computer is the workspace; Lattice computes; LNkernel proves.">
  <rect width="1200" height="376" fill="#0a0a0b"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#5f5f66">
    <text x="72" y="30">LAYER</text>
    <text x="400" y="30">WHAT IT DOES</text>
    <text x="1128" y="30" text-anchor="end">STACK</text>
  </g>
  <line x1="72" y1="40" x2="1128" y2="40" stroke="#2a2a2e" stroke-width="1"/>

  <text x="72" y="74" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" font-style="italic" fill="#8a8a90">a model</text>
  <text x="400" y="74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8a8a90">the interface: any provider, connected over MCP</text>
  <line x1="72" y1="92" x2="1128" y2="92" stroke="#1c1c1f" stroke-width="1"/>

  <rect x="56" y="118" width="5" height="5" fill="#c9b280"/>
  <text x="72" y="126" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" fill="#f2efe9">lionagi</text>
  <text x="400" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b9b7b2">orchestrates: agents, tools, structured output, flows</text>
  <text x="1128" y="126" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6e6e75">Python</text>
  <line x1="72" y1="144" x2="1128" y2="144" stroke="#1c1c1f" stroke-width="1"/>

  <rect x="56" y="170" width="5" height="5" fill="#c9b280"/>
  <text x="72" y="178" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" fill="#f2efe9">khive</text>
  <text x="400" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b9b7b2">remembers and coordinates: graph, retrieval, tasks, messages</text>
  <text x="1128" y="178" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6e6e75">Rust · khive.ai</text>
  <line x1="72" y1="196" x2="1128" y2="196" stroke="#1c1c1f" stroke-width="1"/>

  <rect x="56" y="222" width="5" height="5" fill="#c9b280"/>
  <text x="72" y="230" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" fill="#f2efe9">khive computer</text>
  <text x="400" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b9b7b2">the workspace: trees as values, refs with history, sandboxed actions, git</text>
  <text x="1128" y="230" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6e6e75">Python · Docker</text>
  <line x1="72" y1="248" x2="1128" y2="248" stroke="#1c1c1f" stroke-width="1"/>

  <rect x="56" y="274" width="5" height="5" fill="#c9b280"/>
  <text x="72" y="282" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" fill="#f2efe9">Lattice</text>
  <text x="400" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b9b7b2">computes: transformer inference on Apple Silicon, no Python runtime</text>
  <text x="1128" y="282" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6e6e75">Rust · Metal</text>
  <line x1="72" y1="300" x2="1128" y2="300" stroke="#1c1c1f" stroke-width="1"/>

  <rect x="56" y="326" width="5" height="5" fill="#c9b280"/>
  <text x="72" y="334" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" fill="#f2efe9">LNkernel</text>
  <text x="400" y="334" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b9b7b2">proves: Lean 4 theorems checked against the Rust that ships</text>
  <text x="1128" y="334" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6e6e75">Rust · Lean 4</text>
  <line x1="72" y1="352" x2="1128" y2="352" stroke="#2a2a2e" stroke-width="1"/>
</svg>
