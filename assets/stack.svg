<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="One stack: khive remembers and coordinates, lionagi orchestrates, khive computer is the workspace, Lattice computes, LNkernel proves.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#15213b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7ea3"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f5f7fb">One stack, one loop</text>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="90" width="200" height="120" rx="14" fill="#1c2a4a" stroke="#f6c453" stroke-width="2"/>
    <text x="140" y="130" font-size="22" font-weight="700" fill="#f6c453">khive</text>
    <text x="140" y="158" font-size="15" fill="#dbe2f1">remembers and coordinates</text>
    <text x="140" y="182" font-size="13" fill="#8f9bb8">graph, retrieval, tasks, messages</text>

    <rect x="270" y="90" width="200" height="120" rx="14" fill="#1c2a4a" stroke="#9fd3ff" stroke-width="2"/>
    <text x="370" y="130" font-size="22" font-weight="700" fill="#9fd3ff">lionagi</text>
    <text x="370" y="158" font-size="15" fill="#dbe2f1">orchestrates</text>
    <text x="370" y="182" font-size="13" fill="#8f9bb8">agents, tools, structured output</text>

    <rect x="500" y="90" width="200" height="120" rx="14" fill="#1c2a4a" stroke="#b7f0c1" stroke-width="2"/>
    <text x="600" y="130" font-size="22" font-weight="700" fill="#b7f0c1">khive computer</text>
    <text x="600" y="158" font-size="15" fill="#dbe2f1">workspace for AI agents</text>
    <text x="600" y="182" font-size="13" fill="#8f9bb8">trees, refs, sandboxed exec, git</text>

    <rect x="730" y="90" width="200" height="120" rx="14" fill="#1c2a4a" stroke="#ffb3c1" stroke-width="2"/>
    <text x="830" y="130" font-size="22" font-weight="700" fill="#ffb3c1">Lattice</text>
    <text x="830" y="158" font-size="15" fill="#dbe2f1">computes</text>
    <text x="830" y="182" font-size="13" fill="#8f9bb8">inference on Apple Silicon</text>

    <rect x="960" y="90" width="200" height="120" rx="14" fill="#1c2a4a" stroke="#d9c6ff" stroke-width="2"/>
    <text x="1060" y="130" font-size="22" font-weight="700" fill="#d9c6ff">LNkernel</text>
    <text x="1060" y="158" font-size="15" fill="#dbe2f1">proves</text>
    <text x="1060" y="182" font-size="13" fill="#8f9bb8">Lean 4 against the Rust</text>
  </g>
  <g stroke="#6f7ea3" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="150" x2="268" y2="150"/>
    <line x1="470" y1="150" x2="498" y2="150"/>
    <line x1="700" y1="150" x2="728" y2="150"/>
    <line x1="930" y1="150" x2="958" y2="150"/>
  </g>
  <text x="600" y="258" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b8c2d9">Agents connect over MCP. Every project is built by the agents it serves, and every rough edge they hit is one yours would have hit too.</text>
</svg>
